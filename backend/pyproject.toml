[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "debugpy>=1.8.22",
]

[tool.uv.build-backend]
module-name = "server"

[tool.ruff]
target-version = "py314"
indent-width = 4
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["server"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
