model_list:
  - model_name: default
    litellm_params:
      # .envファイル設定 ※compose.yaml経由で環境変数を取得
      model: os.environ/LLMPROXY_PROVIDER_MODEL
      api_key: os.environ/LLMPROXY_PROVIDER_API_KEY
# - model_name: ollama
#   litellm_params:
#     # Ollama使用可能モデル確認：http://localhost:11434/api/tags または http://host.docker.internal:11434/api/tags ※"model"パラメータ参照
#     model: ollama/<model_name>
#     api_base: http://host.docker.internal:11434

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  request_timeout: 60
  max_parallel_requests: 20
  set_verbose: true
  allowed_models:
    - default

router_settings:
  # fallbacks:
  #   - {"default": ["default"]}
  # routing_strategy: least-busy
  num_retries: 2

