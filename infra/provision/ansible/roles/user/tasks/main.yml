---
- name: アプリケーション用グループ作成
  become: yes
  ansible.builtin.group:
    name: "{{ app_group_name }}"
    gid: "{{ app_gid }}"

- name: アプリケーション用ユーザー作成
  ansible.builtin.user:
    name: "{{ app_user_name }}"
    uid: "{{ app_uid }}"
    password: "{{ app_user_password | password_hash('sha512') }}"
    shell: /bin/bash
    create_home: yes
    group: "{{ app_gid }}"
    groups: sudo
    append: yes

- name: sudoers設定
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ app_user_name }}"
    content: "{{ app_user_name }} ALL=(ALL) ALL\n"
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Ubuntu Insights 無効化（WSL 初回セットアップの同意確認を省略）
  ansible.builtin.shell: |
    command -v ubuntu-insights >/dev/null 2>&1 || exit 0
    for source in linux wsl_setup ubuntu_release_upgrader; do
      su "{{ app_user_name }}" -c "ubuntu-insights consent $source -s=false" >/dev/null
    done
  changed_when: false
