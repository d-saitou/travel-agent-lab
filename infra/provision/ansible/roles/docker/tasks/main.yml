---
- name: Linux 環境判定
  ansible.builtin.command:
    cmd: "/home/{{ app_user_name }}/{{ git_repo_name }}/infra/scripts/detect-linux-or-wsl.sh"
  register: linux_environment
  changed_when: false

#- name: Linux 向け設定 ※非 WSL 環境向けは現状未サポート
#  when: linux_environment.stdout | trim == "linux"
#  block:

- name: WSL 向け設定 ※docker-credential-desktop.exe 起動エラー対応
  when: linux_environment.stdout | trim == "wsl"
  block:
    - name: カスタム Docker 設定ディレクトリ作成
      ansible.builtin.file:
        path: "/home/{{ app_user_name }}/.docker.custom"
        state: directory
        owner: "{{ app_uid }}"
        group: "{{ app_gid }}"
        mode: '0755'

    - name: カスタム Docker 設定ファイル作成
      ansible.builtin.copy:
        content: "{}"
        dest: "/home/{{ app_user_name }}/.docker.custom/config.json"
        owner: "{{ app_uid }}"
        group: "{{ app_gid }}"
        mode: '0644'

    - name: .bashrc 更新 (DOCKER_CONFIG 設定追加)
      ansible.builtin.lineinfile:
        path: "/home/{{ app_user_name }}/.bashrc"
        line: 'export DOCKER_CONFIG="$HOME/.docker.custom"'
        state: present
        create: yes
        owner: "{{ app_uid }}"
        group: "{{ app_gid }}"
        mode: '0644'
