---
- name: コンテナ用 secrets ディレクトリ相対パス設定 ※依存先として他ロールから参照。.env の SECRETS_DIR と一致させること
  ansible.builtin.set_fact:
    secrets_relative_path: ".local/share/travel-agent-lab/secrets"

- name: コンテナ用 secrets ディレクトリ作成 ※ワークスペース外 (.env の SECRETS_DIR)
  ansible.builtin.file:
    path: "/home/{{ app_user_name }}/{{ secrets_relative_path }}"
    state: directory
    owner: "{{ app_uid }}"
    group: "{{ app_gid }}"
    mode: '0700' # app_uid を指定してコンテナを起動するため 0700 に設定
