---
- name: LiteLLM master キーファイル生成
  ansible.builtin.shell:
    cmd: "umask 077 && openssl rand -hex 32 > {{ llmproxy_litellm_master_key_file }}"
    creates: "{{ llmproxy_litellm_master_key_file }}"

- name: LiteLLM master キーファイル権限設定
  ansible.builtin.file:
    path: "{{ llmproxy_litellm_master_key_file }}"
    owner: "{{ app_uid }}"
    group: "{{ app_gid }}"
    mode: '0600'

- name: LLM プロバイダ API キーファイル作成 ※ .env.secrets の値を使用
  ansible.builtin.copy:
    dest: "{{ llmproxy_provider_api_key_file }}"
    content: "{{ llmproxy_provider_api_key }}"
    owner: "{{ app_uid }}"
    group: "{{ app_gid }}"
    mode: '0600'
  no_log: true # コンソール API キー表示防止
