---
- name: apt キャッシュ更新
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: 基本パッケージインストール
  ansible.builtin.apt:
    name:
      - git
      - curl
      - openssl
      - bubblewrap
      - socat
    state: present

- name: GitHub CLI 用 APT keyring ディレクトリ作成
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: GitHub CLI APT signing key ダウンロード
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: "0644"

- name: GitHub CLI APT リポジトリ追加
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    filename: github-cli
    state: present
    update_cache: yes

- name: GitHub CLI インストール
  ansible.builtin.apt:
    name: gh
    state: present
