---
- name: コンテナ用 secrets ディレクトリ作成 ※ワークスペース外 (.env の SECRETS_DIR)
  ansible.builtin.file:
    path: "{{ secrets_dir }}"
    state: directory
    owner: "{{ app_uid }}"
    group: "{{ app_gid }}"
    mode: '0700' # app_uid を指定してコンテナを起動するため 0700 に設定

- name: DB パスワードファイル生成 ※既存ファイルは再生成しない
  ansible.builtin.shell:
    cmd: "umask 077 && openssl rand -hex 32 > {{ secrets_dir }}/{{ item }}"
    creates: "{{ secrets_dir }}/{{ item }}"
  loop:
    - postgres_user.secret
    - app_tx_user.secret
    - app_rag_user.secret

- name: DB パスワードファイル権限設定
  ansible.builtin.file:
    path: "{{ secrets_dir }}/{{ item }}"
    owner: "{{ app_uid }}"
    group: "{{ app_gid }}"
    mode: '0600' # app_uid を指定してコンテナを起動するため 0600 に設定
  loop:
    - postgres_user.secret
    - app_tx_user.secret
    - app_rag_user.secret

- name: DB バックアップ用ディレクトリ作成
  ansible.builtin.file:
    path: "{{ db_backups_dir }}"
    state: directory
    owner: "{{ app_uid }}"
    group: "{{ app_gid }}"
    mode: '0700'
