---
- name: コンテナ用 secrets ディレクトリ作成 ※ワークスペース外 (.env の SECRETS_DIR)
  ansible.builtin.file:
    path: "/home/{{ app_user_name }}/{{ secrets_relative_path }}"
    state: directory
    owner: "{{ app_uid }}"
    group: "{{ app_gid }}"
    mode: '0700' # app_uid を指定してコンテナを起動するため 0700 に設定

- name: DB パスワードファイル作成 ※ .env.secrets の値を使用
  ansible.builtin.copy:
    dest: "/home/{{ app_user_name }}/{{ secrets_relative_path }}/{{ item.file }}"
    content: "{{ item.password }}"
    owner: "{{ app_uid }}"
    group: "{{ app_gid }}"
    mode: '0600' # app_uid を指定してコンテナを起動するため 0600 に設定
  loop:
    - { file: postgres_user.secret, password: "{{ db_postgres_user_password }}" }
    - { file: app_tx_user.secret, password: "{{ db_app_tx_user_password }}" }
    - { file: app_rag_user.secret, password: "{{ db_app_rag_user_password }}" }
  no_log: true # コンソール パスワード表示防止

- name: DB バックアップ用ディレクトリ作成
  ansible.builtin.file:
    path: "{{ db_backups_dir }}"
    state: directory
    owner: "{{ app_uid }}"
    group: "{{ app_gid }}"
    mode: '0700'
