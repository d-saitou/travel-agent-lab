---
- name: Git 設定
  ansible.builtin.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  loop:
    - { name: "user.name", value: "{{ git_user_name }}" }
    - { name: "user.email", value: "{{ git_user_email }}" }

- name: Git リポジトリクローン
  ansible.builtin.git:
    repo: "https://{{ git_user_name }}:{{ git_repo_token }}@github.com/{{ git_repo_owner }}/{{ git_repo_name }}.git"
    dest: "/home/{{ app_user_name }}/{{ git_repo_name }}"
    version: "{{ git_repo_branch }}"
    update: no
    force: no
  no_log: true
