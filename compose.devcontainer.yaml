services:

  frontend:
    command: sleep infinity # 二重起動防止 ※ Next.js は frontend/.vscode/launch.json から起動
    depends_on:
      backend:
        condition: service_started

  backend:
    command: sleep infinity # 二重起動防止：FastAPI は backend/.vscode/launch.json から起動
    healthcheck:
      disable: true
