services:

  # Frontend (Next.js)
  frontend:
    container_name: travel-agent-lab-frontend
    image: travel-agent-lab-frontend:development
    build:
      context: ./frontend
      dockerfile: ../infra/container/frontend/Dockerfile
      args:
        FRONTEND_NODE_IMAGE: "${FRONTEND_NODE_IMAGE}"
        APP_UID: "${APP_UID}"
        APP_GID: "${APP_GID}"
      target: development
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "9229:9229" # 開発環境用：Node.jsデバッグ
    volumes:
      - .:/app # 開発環境用：コンテナ内ソースホットリロード＋git管理のためルートをマウント
      - frontend_node_modules:/app/frontend/node_modules
      - frontend_next_cache:/app/frontend/.next

  # Backend (FastAPI)
  backend:
    container_name: travel-agent-lab-backend
    image: travel-agent-lab-backend:development
    build:
      context: ./backend
      dockerfile: ../infra/container/backend/Dockerfile
      args:
        BACKEND_PYTHON_IMAGE: "${BACKEND_PYTHON_IMAGE}"
        BACKEND_UV_VERSION: "${BACKEND_UV_VERSION}"
        APP_UID: "${APP_UID}"
        APP_GID: "${APP_GID}"
      target: development
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 1s
      timeout: 1s
      retries: 30
    ports:
      - "8000:8000"
      - "5678:5678" # 開発環境用：debugpyデバッグ
    volumes:
      - .:/app                          # 開発環境用：コンテナ内ソースホットリロード＋git管理のためルートをマウント
      - backend_venv:/app/backend/.venv # 開発環境用：Python仮想環境ボリューム

  # DB (PostgreSQL + pgvector)
  db:
    container_name: travel-agent-lab-db
    build:
      context: ./infra/container/db
      dockerfile: Dockerfile
      args:
        DB_PGVECTOR_IMAGE: "${DB_PGVECTOR_IMAGE}"
    # restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 1s
      timeout: 1s
      retries: 30
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_postgres_user
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - db_postgres_user
      - db_app_tx_user
      - db_app_rag_user
    volumes:
      - db_data:/var/lib/postgresql
      - ./infra/container/db/initdb.d:/docker-entrypoint-initdb.d
      - ./data/db/backups/postgres:/var/backups/postgres:ro

  # LLM Proxy (LiteLLM)
  llmproxy:
    container_name: travel-agent-lab-llmproxy
    build:
      context: ./infra/container/llmproxy
      dockerfile: Dockerfile
      args:
        LLMPROXY_PYTHON_IMAGE: "${LLMPROXY_PYTHON_IMAGE}"
        LLMPROXY_LITELLM_VERSION: "${LLMPROXY_LITELLM_VERSION}"
        APP_UID: "${APP_UID}"
        APP_GID: "${APP_GID}"
    environment:
      LLMPROXY_PROVIDER_MODEL: "${LLMPROXY_PROVIDER_MODEL}"
      LLMPROXY_PROVIDER_API_KEY: "${LLMPROXY_PROVIDER_API_KEY}"
    ports:
      - "4000:4000"
    secrets:
      - llmproxy_litellm_master_key
    volumes:
      - ./infra/container/llmproxy/config/config.yaml:/app/config.yaml

secrets:
  db_postgres_user:
    file: ./infra/container/db/secrets/postgres_user.secret
  db_app_tx_user:
    file: ./infra/container/db/secrets/app_tx_user.secret
  db_app_rag_user:
    file: ./infra/container/db/secrets/app_rag_user.secret
  llmproxy_litellm_master_key:
    file: ./infra/container/llmproxy/secrets/litellm_master_key.secret

volumes:
  frontend_node_modules:
  frontend_next_cache:
  backend_venv:
  db_data:
